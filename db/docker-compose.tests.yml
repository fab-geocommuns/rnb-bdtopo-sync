version: "3.9"

services:
  postgis:
    image: postgis/postgis:13-3.5
    env_file:
      - ./../.env.tests
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
